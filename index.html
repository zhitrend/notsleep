<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title data-i18n="title">防止电脑睡眠</title>
  <style>
    body { font-family: 'Segoe UI', 'PingFang SC', Arial, sans-serif; background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%); margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 90%; max-width: 420px; margin: 20px auto; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 32px 24px; text-align: center; }
    h1 { color: #2c3e50; margin-bottom: 24px; font-size: 1.8rem; }
    select { font-size: 1rem; padding: 10px 16px; border-radius: 8px; border: 1px solid #ddd; margin: 8px 0; width: 200px; background: #f8f9fa; cursor: pointer; transition: all 0.2s; }
    select:hover { border-color: #74ebd5; }
    select:focus { outline: none; border-color: #2d8cf0; box-shadow: 0 0 0 2px rgba(45,140,240,0.2); }
    button { font-size: 1rem; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.3s; margin: 8px; font-weight: 500; }
    #startBtn { background: #74ebd5; color: #2c3e50; }
    #startBtn:hover { background: #63d4be; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(116,235,213,0.3); }
    #stopBtn { background: #ff7675; color: white; }
    #stopBtn:hover { background: #e66767; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,118,117,0.3); }
    .status { margin-top: 24px; color: #2d8cf0; font-weight: 500; padding: 12px; border-radius: 8px; background: rgba(45,140,240,0.1); }
    .lang-switch { margin-bottom: 20px; }
    .lang-btn { background: #f8f9fa; border: none; border-radius: 6px; padding: 6px 16px; margin: 0 4px; font-size: 0.9rem; cursor: pointer; color: #2d8cf0; transition: all 0.2s; }
    .lang-btn.active, .lang-btn:hover { background: #2d8cf0; color: #fff; transform: translateY(-1px); }
    .prevention-methods { margin-bottom: 24px; text-align: left; background: #f8f9fa; padding: 16px; border-radius: 12px; }
    .checkbox-group { margin: 12px 0; display: flex; flex-direction: column; gap: 10px; }
    .checkbox-group label { margin: 0; display: flex; align-items: center; cursor: pointer; padding: 6px 0; transition: all 0.2s; }
    .checkbox-group label:hover { color: #2d8cf0; }
    .checkbox-group input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; accent-color: #2d8cf0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-zh">中文</button>
      <button class="lang-btn" id="btn-en">English</button>
    </div>
    <h1 data-i18n="title">防止电脑睡眠</h1>
    <div class="prevention-methods">
      <label data-i18n="methodsLabel">选择阻止方式：</label>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="method-display" checked>
          <span data-i18n="methodDisplay">阻止显示器睡眠</span>
        </label>
        <label>
          <input type="checkbox" id="method-system" checked>
          <span data-i18n="methodSystem">阻止系统睡眠</span>
        </label>
        <label>
          <input type="checkbox" id="method-screensaver">
          <span data-i18n="methodScreensaver">禁用屏幕保护</span>
        </label>
        <label>
          <input type="checkbox" id="method-activity">
          <span data-i18n="methodActivity">模拟用户活动</span>
        </label>
      </div>
    </div>
    <label for="duration" data-i18n="label">选择阻止睡眠时长：</label>
    <select id="duration">
      <option value="5" data-i18n="opt5">5分钟</option>
      <option value="10" data-i18n="opt10">10分钟</option>
      <option value="30" data-i18n="opt30">30分钟</option>
      <option value="60" data-i18n="opt60">1小时</option>
      <option value="0" data-i18n="opt0">无限制</option>
    </select>
    <br>
    <button id="startBtn" data-i18n="start">开始阻止睡眠</button>
    <button id="stopBtn" data-i18n="stop">恢复睡眠</button>
    <div class="status" id="status"></div>
  </div>
  <script src="renderer.js"></script>
  <script>
    const zh = {
      title: "防止电脑睡眠",
      label: "选择阻止睡眠时长：",
      opt5: "5分钟",
      opt10: "10分钟",
      opt30: "30分钟",
      opt60: "1小时",
      opt0: "无限制",
      start: "开始阻止睡眠",
      stop: "恢复睡眠",
      statusBlock: "已阻止电脑睡眠",
      statusRestore: "已恢复电脑可睡眠",
      methodsLabel: "选择阻止方式：",
      methodDisplay: "阻止显示器睡眠",
      methodSystem: "阻止系统睡眠",
      methodScreensaver: "禁用屏幕保护",
      methodActivity: "模拟用户活动"
    };
    const en = {
      title: "Prevent Computer Sleep",
      label: "Select duration to prevent sleep:",
      opt5: "5 min",
      opt10: "10 min",
      opt30: "30 min",
      opt60: "1 hour",
      opt0: "Unlimited",
      start: "Start Anti-Sleep",
      stop: "Restore Sleep",
      statusBlock: "Sleep prevention is ON",
      statusRestore: "Sleep is now allowed",
      methodsLabel: "Select prevention methods:",
      methodDisplay: "Prevent display sleep",
      methodSystem: "Prevent system sleep",
      methodScreensaver: "Disable screensaver",
      methodActivity: "Simulate user activity"
    };
    function setLang(lang) {
      const dict = lang === 'en' ? en : zh;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
      document.getElementById('btn-zh').classList.toggle('active', lang==='zh');
      document.getElementById('btn-en').classList.toggle('active', lang==='en');
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
      // 状态栏切换时清空提示
      document.getElementById('status').textContent = '';
    }
    document.getElementById('btn-zh').onclick = () => setLang('zh');
    document.getElementById('btn-en').onclick = () => setLang('en');
    setLang('zh');
    // 导出语言切换给renderer.js使用
    window.getLangDict = function(lang) { return lang === 'en' ? en : zh; };
    window.getCurrentLang = function() { return document.documentElement.lang === 'en' ? 'en' : 'zh'; };
  </script>
</body>
</html>
